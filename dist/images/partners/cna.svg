<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none" class="partner-logo-svg">
    <!-- CNA Bold Monogram & Red Accent Bar -->
    <g transform="translate(10, 6)">
        <!-- Red vertical bar accent -->
        <rect x="0" y="3" width="8" height="30" rx="3" fill="#D32F2F"/>
        <!-- CNA Bold Letters -->
        <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#0A2540" letter-spacing="1.5">CNA</text>
    </g>
    <text x="96" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11.5" fill="#64748B" letter-spacing="2">INSURANCE</text>
</svg>
